<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
<title id="title">TrafficRobot software modules</title><desc id="desc">WPF views and view models connect core algorithms with speech, traffic signals and device services.</desc>
