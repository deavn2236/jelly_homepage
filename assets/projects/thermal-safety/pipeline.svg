      <rect x="377" y="90" width="295" height="180" rx="12" fill="#f4f1e9"/>
      <rect x="729" y="90" width="295" height="180" rx="12" fill="#eef2f9"/>
      <rect x="1081" y="90" width="295" height="180" rx="12" fill="#f7eeee"/>
